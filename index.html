<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7a4d" />
    <meta name="color-scheme" content="light dark" />

    <!-- Baseline metadata. Per-page values are rendered by <Seo>, which
         React 19 hoists into this head at runtime. These defaults are what
         non-JS crawlers and link unfurlers fall back to. -->
    <meta
      name="description"
      content="Tech-Aura is a Lagos-based Nigerian construction and engineering company delivering energy-efficient buildings, roads, power, water and oil &amp; gas infrastructure across Nigeria since 2009."
    />
    <meta name="author" content="Tech-Aura Construction and Engineering Services Ltd." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="geo.region" content="NG-LA" />
    <meta name="geo.placename" content="Lagos, Nigeria" />
    <link rel="canonical" href="https://www.tech-aura.com.ng/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tech-Aura" />
    <meta property="og:locale" content="en_NG" />
    <meta
      property="og:title"
      content="Tech-Aura | Construction &amp; Engineering Company in Lagos, Nigeria"
    />
    <meta
      property="og:description"
      content="Energy-efficient buildings, roads, power, water and oil &amp; gas infrastructure delivered across Nigeria since 2009."
    />
    <meta property="og:url" content="https://www.tech-aura.com.ng/" />
    <meta property="og:image" content="https://www.tech-aura.com.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.tech-aura.com.ng/og-image.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/media/hero-poster.svg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- All project, article and team photography is served from here, so
         warming the connection saves a DNS + TLS round trip on first paint. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Fonts load without blocking render: the stylesheet is fetched at
         `print` priority, then promoted to `all` once it arrives. Combined
         with `display=swap` in the URL, text paints immediately in the
         fallback face instead of waiting two round trips. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <title>Tech-Aura Construction and Engineering Services | Lagos, Nigeria</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors getInitialTheme() in src/features/theme/themeSlice.js:
      // an explicit stored choice wins, otherwise default to light.
      (function () {
        try {
          if (localStorage.getItem('tech-aura-theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
