<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7a4d" />
    <meta name="color-scheme" content="light dark" />

    <!-- Baseline metadata. Per-page values are rendered by <Seo>, which
         React 19 hoists into this head at runtime. These defaults are what
         non-JS crawlers and link unfurlers fall back to. -->
    <meta
      name="description"
      content="Tech-Aura is a Lagos-based Nigerian construction and engineering company delivering energy-efficient buildings, roads, power, water and oil &amp; gas infrastructure across Nigeria since 2009."
    />
    <meta name="author" content="Tech-Aura Construction and Engineering Services Ltd." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="geo.region" content="NG-LA" />
    <meta name="geo.placename" content="Lagos, Nigeria" />
    <link rel="canonical" href="https://www.tech-aura.ng/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tech-Aura" />
    <meta property="og:locale" content="en_NG" />
    <meta
      property="og:title"
      content="Tech-Aura | Construction &amp; Engineering Company in Lagos, Nigeria"
    />
    <meta
      property="og:description"
      content="Energy-efficient buildings, roads, power, water and oil &amp; gas infrastructure delivered across Nigeria since 2009."
    />
    <meta property="og:url" content="https://www.tech-aura.ng/" />
    <meta property="og:image" content="https://www.tech-aura.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.tech-aura.ng/og-image.png" />

    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/media/hero-poster.svg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tech-Aura Construction and Engineering Services | Lagos, Nigeria</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors getInitialTheme() in src/features/theme/themeSlice.js.
      (function () {
        try {
          var stored = localStorage.getItem('tech-aura-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
