<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F14" />
    <meta
      name="description"
      content="Tech-Aura Construction and Engineering Services Limited - a Lagos-based Nigerian construction and engineering firm delivering buildings, roads, energy, power and water infrastructure across Nigeria."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tech-Aura Construction and Engineering Services | Lagos, Nigeria</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors getInitialTheme() in src/features/theme/themeSlice.js.
      (function () {
        try {
          var stored = localStorage.getItem('tech-aura-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
